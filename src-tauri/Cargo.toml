[package]
name = "gas-station-game"
version = "0.1.0"
description = "Desktop shell for the Gas Station Game prototype"
authors = ["Gas Station Game contributors"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "gas_station_game_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
