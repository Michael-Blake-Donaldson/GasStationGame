name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify source and web production build
        run: pnpm verify
      - name: Verify Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Verify desktop Rust shell
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
