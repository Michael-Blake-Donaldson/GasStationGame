name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run complete source and production gate
        run: pnpm verify:all

  rust-msrv:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install declared minimum Rust toolchain
        run: rustup toolchain install 1.88.0-x86_64-pc-windows-msvc --profile minimal
      - name: Check desktop shell against declared minimum Rust
        run: cargo +1.88.0-x86_64-pc-windows-msvc check --manifest-path src-tauri/Cargo.toml --locked
